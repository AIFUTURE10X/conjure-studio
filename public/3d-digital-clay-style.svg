<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="3D Digital Clay style example: a smooth computer-rendered clay character">
  <defs>
    <linearGradient id="digital-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#efe7df"/>
      <stop offset="1" stop-color="#c9b6a5"/>
    </linearGradient>
    <radialGradient id="digital-body" cx="0.32" cy="0.22" r="0.9">
      <stop offset="0" stop-color="#ffad80"/>
      <stop offset="0.48" stop-color="#dd7549"/>
      <stop offset="1" stop-color="#9e3f20"/>
    </radialGradient>
    <radialGradient id="digital-eye" cx="0.32" cy="0.24" r="0.82">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9ddd0"/>
    </radialGradient>
    <filter id="digital-shadow" x="-40%" y="-40%" width="180%" height="180%">
