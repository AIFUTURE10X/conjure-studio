name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Contract — logo generator
        run: npm run check:logo

      - name: Contract — prompt merge
        run: npm run check:prompt-merge

      - name: Contract — applied edit history
        run: npm run check:applied-edit-history

      - name: Contract — AI helper UI
        run: npm run check:ai-helper-ui

      - name: Contract — AI helper scenarios
        run: npm run check:ai-helper-scenarios

      - name: Contract — AI helper models
        run: npm run check:ai-helper-models

      - name: Contract — image references UI
        run: npm run check:image-references

      - name: Contract — gemini inspire identity
        run: npm run check:gemini-identity

      - name: Contract — video history query
        run: npm run check:video-history-query

      - name: Contract — logo 3D extrude params
        run: npm run check:logo-3d

      - name: Contract — logo 3D export maths
        run: npm run check:logo-3d-export

      - name: Contract — persistence identity
        run: npm run check:persistence-identity

      - name: Contract — history persistence
        run: npm run check:history-persistence

      - name: Contract — history blob fallback
        run: npm run check:history-blob-fallback

      - name: Contract — background remover resilience
        run: npm run check:bg-remover

      - name: Contract — image annotation tool
        run: npm run check:image-annotation

      - name: Contract — OpenAI reliability migration
        run: npm run check:openai-migration

      - name: Contract — translation tool
        run: npm run check:translation-tool

      # Fails the build if package.json defines a check:* script that has no
      # step above. Every past history regression shipped past a guard that
      # existed but was never wired into CI — this makes that impossible.
      - name: Contract — every check runs in CI
        run: npm run check:ci-coverage

      - name: Build
        run: npm run build
